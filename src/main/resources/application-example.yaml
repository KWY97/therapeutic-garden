spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 105MB
      resolve-lazily: true
  application:
    name: manage

  datasource:
    url: jdbc:mysql://localhost:3306/manage
    username: root
    password: YOUR_MYSQL_PASSWORD

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

kakao:
  maps:
    javascript-key: YOUR_KAKAO_MAPS_JAVASCRIPT_KEY

landing:
  personal-change-participant-no: ${LANDING_PERSONAL_CHANGE_PARTICIPANT_NO:6}

storage:
  mode: ${STORAGE_MODE:local}
  bucket: ${BUCKET:}
  access-key-id: ${ACCESS_KEY_ID:}
  secret-access-key: ${SECRET_ACCESS_KEY:}
  region: ${REGION:auto}
  endpoint: ${ENDPOINT:}
  read-url-duration: 1h
  local-directory: ${STORAGE_LOCAL_DIRECTORY:.local/uploads}
  recovery-directory: ${STORAGE_RECOVERY_DIRECTORY:.local/image-recovery}
