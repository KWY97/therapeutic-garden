<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="home-header" th:fragment="header">
    <div class="home-utility-bar">
        <nav class="home-login-navigation" aria-label="서비스 메뉴">
            <a class="home-login-link" th:if="${session.loginAdminId == null and session.loginMemberId == null}" th:href="@{/admin/login}">관리자 로그인</a>
            <a class="home-login-link" th:if="${session.loginAdminId == null and session.loginMemberId == null}" th:href="@{/member/login}">참가자 로그인</a>
            <div class="admin-settings-menu" th:if="${session.loginAdminId != null}">
                <a class="home-login-link admin-settings-link" th:href="@{/admin}">통합 설정</a>
                <button class="admin-settings-toggle" type="button" aria-label="통합 설정 메뉴 열기" aria-haspopup="true">▾</button>
                <div class="admin-settings-dropdown" role="menu">
                    <a role="menuitem" th:href="@{/admin/sites}">사이트 관리</a>
                    <a role="menuitem" th:href="@{/admin/members}">참가자 관리</a>
                    <a role="menuitem" th:href="@{/admin/schedules}">일정 목록</a>
                    <a role="menuitem" th:href="@{/admin/schedules/calendar}">달력 보기</a>
                    <a role="menuitem" th:href="@{/admin/password}">비밀번호 변경</a>
                </div>
            </div>
            <a class="home-login-link" th:if="${session.loginAdminId != null}" th:href="@{/admin/logout}">로그아웃</a>
            <a class="home-login-link" th:if="${session.loginAdminId == null and session.loginMemberId != null}" th:href="@{/member/mypage}">마이페이지</a>
            <a class="home-login-link" th:if="${session.loginAdminId == null and session.loginMemberId != null}" th:href="@{/member/logout}">로그아웃</a>
        </nav>
    </div>
    <div class="home-brand-header">
        <div class="home-header-inner">
            <a class="home-brand" th:href="${session.loginAdminId != null} ? @{/admin/monitoring} : (${session.loginMemberId != null} ? @{/member} : @{/})">
                <img class="home-logo" th:src="@{/images/logo/logo.png}" alt="THE H × RecoSync">
                <span class="home-title">치유 공간 모니터링</span>
            </a>
        </div>
    </div>
</header>
</body>
</html>
