<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modal" id="spotDetailModal" class="survey-modal" hidden>
    <div class="spot-detail-dialog" role="dialog" aria-modal="true" aria-labelledby="spotDetailTitle" tabindex="-1">
        <header class="monitoring-heading">
            <div><p class="site-panel-label">HEALING SPOT</p><h2 id="spotDetailTitle"></h2><p id="spotDetailCourse"></p></div>
            <button type="button" id="closeSpotDetailButton" aria-label="HS 상세 닫기">×</button>
        </header>
        <div class="spot-detail-content">
            <section aria-label="HS 이미지 갤러리">
                <div class="spot-detail-hero"><img id="spotImage" hidden alt=""><span id="spotImageEmpty"></span></div>
                <div id="spotThumbnails" class="spot-thumbnails" aria-label="이미지 선택" hidden></div>
                <p id="spotGalleryStatus" role="status"></p>
            </section>
            <section class="spot-detail-section" aria-labelledby="spotInfoTitle">
                <h3 id="spotInfoTitle">HS 기본 정보</h3>
                <dl><div><dt>HS code</dt><dd id="spotId"></dd></div><div><dt>HS name</dt><dd id="spotName"></dd></div><div><dt>Healing Course</dt><dd id="spotCourse"></dd></div><div><dt>Site</dt><dd id="spotSiteName"></dd></div><div><dt>주소</dt><dd id="spotSiteAddress"></dd></div></dl>
            </section>
            <section class="spot-detail-section" aria-labelledby="spotMeasurementTitle"><h3 id="spotMeasurementTitle">측정 데이터</h3><div id="spotAnalysis" aria-live="polite"></div><div id="spotMeasurementHistory" class="measurement-history" aria-live="polite"></div></section>
        </div>
    </div>
</div>
</body>
</html>
