<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 로그인</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">
    <section class="card login-card">
        <div class="card-header">
            <p class="card-eyebrow">Participant</p>
            <h1 class="card-title">참가자 로그인</h1>
            <p class="card-description">
                전달받은 참가자 계정으로 로그인해 주세요.
            </p>
        </div>

        <p class="error-message" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <p class="password-success-message" role="status" th:if="${param.passwordChanged != null}">비밀번호가 변경되었습니다. 새 비밀번호로 다시 로그인해 주세요.</p>
        <form class="login-form"
              th:action="@{/member/login}"
              method="post">
            <div class="form-group">
                <label class="form-label" for="loginId">
                    아이디
                </label>

                <input
                        class="form-input"
                        type="text"
                        id="loginId"
                        name="loginId"
                        placeholder="아이디를 입력하세요"
                        autocomplete="username"
                        required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">
                    비밀번호
                </label>

                <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                >
            </div>

            <button class="primary-button" type="submit">
                로그인
            </button>
        </form>

        <a class="back-link" th:href="@{/}">
            홈으로 돌아가기
        </a>
    </section>
</main>

</body>
</html>
