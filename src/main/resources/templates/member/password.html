<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="page-container">
    <section class="card login-card">
        <div class="card-header">
            <p class="card-eyebrow">Participant</p>
            <h1 class="card-title">비밀번호 변경</h1>
            <p class="card-description">새 비밀번호는 8자 이상으로 입력해 주세요.</p>
        </div>
        <p class="error-message" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <form class="login-form" th:action="@{/member/password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label" for="currentPassword">현재 비밀번호</label>
                <input class="form-input" type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="newPassword">새 비밀번호</label>
                <input class="form-input" type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">새 비밀번호 확인</label>
                <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="account-form-actions">
                <a class="secondary-link-button" th:href="@{/member}">취소</a>
                <button class="primary-button" type="submit">변경</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
