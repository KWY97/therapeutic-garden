<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>참가자 일정</title>

    <!-- FullCalendar 전체 기능 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>

    <!-- FullCalendar 테마 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>

    <!-- FullCalendar 한국어 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales/ko/global.js"></script>

    <!-- FullCalendar 구조 및 테마 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css">

    <!-- 프로젝트 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/measurement-history.css}">
    <link rel="stylesheet" th:href="@{/css/home-spatial.css(v='count-improvement')}">
</head>

<body class="dashboard-body service-page participant-analysis-page">
<header th:replace="~{fragments/header :: header}"></header>




<main class="dashboard-container">
    <p th:if="${testAccount}" class="calendar-report-notice">테스트 계정 · 개인 치유 분석은 참조 데이터를 읽기 전용으로 표시합니다.</p>
    <div th:replace="~{fragments/member-healing-analysis :: analysis(true)}"></div>

    <!-- ================================
         FullCalendar
    ================================= -->
    <section class="calendar-section">

        <div class="section-heading">

            <div>

                <p class="section-label">
                    MY CALENDAR
                </p>

                <h2 class="section-title">
                    나의 달력
                </h2>

                <p class="calendar-report-notice">측정 일정에 따른 개인별 분석 리포트를 준비하고 있습니다. 추후 업데이트될 예정입니다.</p>

            </div>

        </div>


        <div class="calendar-card full-calendar-card">

            <div id="calendar"></div>

        </div>

    </section>


    <!-- ================================
         FullCalendar에 전달할 DB 일정 데이터
    ================================= -->
    <div
            id="schedule-data"
            hidden>

        <div
                class="schedule-data-item"
                th:each="schedule : ${schedules}"
                th:attr="
                    data-id=${schedule.scheduleId},
                    data-date=${schedule.scheduleDate},
                    data-course-id=${schedule.courseId},
                    data-course-label=|${schedule.siteName} / ${schedule.courseCode} ${schedule.courseName}|,
                    data-group-no=${schedule.member.groupNo},
                    data-weather=${schedule.weather}">
        </div>

    </div>
</main>

<div th:replace="~{fragments/spot-detail-modal :: modal}"></div>

<th:block th:replace="~{fragments/member-healing-analysis :: scripts}"></th:block>

<!-- ================================
     FullCalendar 실행
================================= -->
<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /*
             * FullCalendar 출력 위치
             */
            const calendarElement =
                document.getElementById(
                    "calendar"
                );


            /*
             * Thymeleaf가 만든
             * 일정 데이터 가져오기
             */
            const scheduleItems =
                document.querySelectorAll(
                    ".schedule-data-item"
                );


            /*
             * FullCalendar event 생성
             */
            const calendarEvents =
                Array.from(scheduleItems)
                    .map(function (scheduleItem) {


                        /*
                         * 코스
                         */
                        const course =
                            scheduleItem.dataset.courseLabel;


                        // DB 코스 ID를 기준으로 달력 색상을 일정하게 유지한다.
                        const courseId = Number(scheduleItem.dataset.courseId || 0);
                        const courseColor = courseId
                                ? `hsl(${(courseId * 137) % 360}, 55%, 42%)` : "#64748b";

                        return {

                            /*
                             * Schedule PK
                             */
                            id:
                                scheduleItem.dataset.id,


                            /*
                             * 달력에 표시되는 제목
                             */
                            title:
                                `코스 ${course}`,


                            /*
                             * 일정 날짜
                             */
                            start:
                                scheduleItem.dataset.date,


                            /*
                             * 종일 일정
                             */
                            allDay:
                                true,


                            /*
                             * FullCalendar v7
                             * 이벤트 색상
                             */
                            color:
                                courseColor,


                            /*
                             * 글자 색상
                             */
                            contrastColor:
                                "#ffffff"
                        };

                    });


            /*
             * FullCalendar 생성
             */
            const calendar =
                new FullCalendar.Calendar(
                    calendarElement,
                    {


                        /*
                         * 월간 달력
                         */
                        initialView:
                            "dayGridMonth",


                        /*
                         * 현재 달
                         */
                        initialDate:
                            new Date(),


                        /*
                         * 한국어
                         */
                        locale:
                            "ko",


                        /*
                         * 상단 메뉴
                         */
                        headerToolbar: {

                            left:
                                "prev,next",

                            center:
                                "title",

                            right:
                                "today"
                        },


                        /*
                         * 일요일부터 시작
                         */
                        firstDay:
                            0,


                        /*
                         * DB 일정
                         */
                        events:
                            calendarEvents,


                        /*
                         * 종일 일정이므로
                         * 시간 숨김
                         */
                        displayEventTime:
                            false,


                        /*
                         * 일정이 많아도
                         * 모두 표시
                         */
                        dayMaxEvents:
                            false,


                        /*
                         * 달력 높이 자동
                         */
                        height:
                            "auto",


                        /*
                         * 코스 일정이 화면에 생성되면
                         * hover용 클래스 추가
                         */
                        eventDidMount:
                            function (info) {

                                info.el.classList.add(
                                    "member-calendar-event"
                                );
                            }



                    }
                );


            /*
             * 달력 출력
             */
            calendar.render();

            const calendarTitle =
                calendarElement.querySelector(
                    '[role="heading"][aria-level="2"]'
                );

            if (calendarTitle) {
                const calendarToolbar =
                    calendarTitle.parentElement.parentElement;

                calendarToolbar.classList.add(
                    "calendar-toolbar-grid"
                );

                Array.from(calendarToolbar.children)
                    .forEach(function (toolbarColumn) {
                        toolbarColumn.classList.add(
                            "calendar-toolbar-column"
                        );
                    });
            }

        }
    );

</script>

</body>
</html>
