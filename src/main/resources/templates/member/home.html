<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>참가자 일정</title>

    <!-- FullCalendar 전체 기능 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>

    <!-- FullCalendar 테마 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/global.js"></script>

    <!-- FullCalendar 한국어 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/locales/ko/global.js"></script>

    <!-- FullCalendar 구조 및 테마 CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/theme.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/monarch/palettes/purple.css">

    <!-- 프로젝트 공통 CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/measurement-history.css}">
</head>

<body class="dashboard-body service-page participant-analysis-page">
<header th:replace="~{fragments/header :: header}"></header>




<main class="dashboard-container">
    <section class="my-healing-section" aria-labelledby="myHealingTitle">
        <div class="section-heading my-healing-heading">
            <div>
                <p class="section-label">MY HEALING ANALYSIS</p>
                <h2 id="myHealingTitle" class="section-title">나의 치유 분석</h2>
                <p class="my-healing-description">나의 공간별 치유 효과와 측정 변화를 확인합니다.</p>
            </div>
        </div>
        <div class="calendar-card my-healing-card">
            <div id="memberAnalysisHighlights" aria-live="polite"></div>
            <section class="member-analysis-detail" aria-labelledby="memberAnalysisDetailTitle">
                <h3 id="memberAnalysisDetailTitle">Spot별 변화 / 상세 분석</h3>
                <div id="memberAnalysisSummary"></div>
            </section>
            <section id="memberAnalysisHistory" class="measurement-history" aria-label="나의 측정 기록"></section>
        </div>
    </section>

    <!-- ================================
         FullCalendar
    ================================= -->
    <section class="calendar-section">

        <div class="section-heading">

            <div>

                <p class="section-label">
                    MY CALENDAR
                </p>

                <h2 class="section-title">
                    나의 달력
                </h2>

            </div>

        </div>


        <div class="calendar-card full-calendar-card">

            <div id="calendar"></div>

        </div>

    </section>


    <!-- ================================
         FullCalendar에 전달할 DB 일정 데이터
    ================================= -->
    <div
            id="schedule-data"
            hidden>

        <div
                class="schedule-data-item"
                th:each="schedule : ${schedules}"
                th:attr="
                    data-id=${schedule.scheduleId},
                    data-date=${schedule.scheduleDate},
                    data-course-id=${schedule.courseId},
                    data-course-label=|${schedule.siteName} / ${schedule.courseCode} ${schedule.courseName}|,
                    data-group-no=${schedule.member.groupNo},
                    data-weather=${schedule.weather}">
        </div>

    </div>


    <!-- ================================
         선택한 일정 상세
    ================================= -->
    <section
            id="schedule-detail"
            class="schedule-detail-card">

        <div class="schedule-detail-header">

            <div>

                <p class="section-label">
                    SELECTED SCHEDULE
                </p>

                <h2
                        id="selected-date-title"
                        class="schedule-detail-title">

                    일정을 선택해 주세요.

                </h2>

            </div>


            <span
                    id="selected-course"
                    class="course-badge">

                -

            </span>

        </div>


        <div class="schedule-summary">


            <!-- 그룹 -->
            <div class="schedule-summary-item">

                <span>
                    그룹
                </span>

                <strong id="selected-group">
                    -
                </strong>

            </div>


            <!-- 날씨 -->
            <div class="schedule-summary-item">

                <span>
                    날씨
                </span>

                <strong id="selected-weather">
                    -
                </strong>

            </div>

        </div>


        <!-- 스팟 일정 -->
        <div
                id="selected-spots"
                class="schedule-list">
        </div>

    </section>

</main>

<script th:inline="javascript">
    window.memberHealingEffects = /*[[${spotEffects}]]*/ [];
    window.memberOverallImprovement = /*[[${overallImprovement}]]*/ null;
    window.memberMeasurementHistory = /*[[${measurementHistory}]]*/ [];
</script>
<script th:src="@{/js/measurement-history.js?v=participant-analysis}"></script>
<script th:src="@{/js/member-healing-analysis.js?v=participant-analysis}"></script>


<!-- ================================
     FullCalendar 실행
================================= -->
<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /*
             * FullCalendar 출력 위치
             */
            const calendarElement =
                document.getElementById(
                    "calendar"
                );


            /*
             * 상세정보 출력 요소
             */
            const selectedDateTitle =
                document.getElementById(
                    "selected-date-title"
                );


            const selectedCourse =
                document.getElementById(
                    "selected-course"
                );


            const selectedGroup =
                document.getElementById(
                    "selected-group"
                );


            const selectedWeather =
                document.getElementById(
                    "selected-weather"
                );


            const selectedSpots =
                document.getElementById(
                    "selected-spots"
                );


            const scheduleDetailSection =
                document.getElementById(
                    "schedule-detail"
                );


            /*
             * Thymeleaf가 만든
             * 일정 데이터 가져오기
             */
            const scheduleItems =
                document.querySelectorAll(
                    ".schedule-data-item"
                );


            /*
             * FullCalendar event 생성
             */
            const calendarEvents =
                Array.from(scheduleItems)
                    .map(function (scheduleItem) {


                        /*
                         * 코스
                         */
                        const course =
                            scheduleItem.dataset.courseLabel;


                        // DB 코스 ID를 기준으로 달력 색상을 일정하게 유지한다.
                        const courseId = Number(scheduleItem.dataset.courseId || 0);
                        const courseColor = courseId
                                ? `hsl(${(courseId * 137) % 360}, 55%, 42%)` : "#64748b";

                        return {

                            /*
                             * Schedule PK
                             */
                            id:
                                scheduleItem.dataset.id,


                            /*
                             * 달력에 표시되는 제목
                             */
                            title:
                                `코스 ${course}`,


                            /*
                             * 일정 날짜
                             */
                            start:
                                scheduleItem.dataset.date,


                            /*
                             * 종일 일정
                             */
                            allDay:
                                true,


                            /*
                             * FullCalendar v7
                             * 이벤트 색상
                             */
                            color:
                                courseColor,


                            /*
                             * 글자 색상
                             */
                            contrastColor:
                                "#ffffff"
                        };

                    });


            /*
             * FullCalendar 생성
             */
            const calendar =
                new FullCalendar.Calendar(
                    calendarElement,
                    {


                        /*
                         * 월간 달력
                         */
                        initialView:
                            "dayGridMonth",


                        /*
                         * 현재 달
                         */
                        initialDate:
                            new Date(),


                        /*
                         * 한국어
                         */
                        locale:
                            "ko",


                        /*
                         * 상단 메뉴
                         */
                        headerToolbar: {

                            left:
                                "prev,next",

                            center:
                                "title",

                            right:
                                "today"
                        },


                        /*
                         * 일요일부터 시작
                         */
                        firstDay:
                            0,


                        /*
                         * DB 일정
                         */
                        events:
                            calendarEvents,


                        /*
                         * 종일 일정이므로
                         * 시간 숨김
                         */
                        displayEventTime:
                            false,


                        /*
                         * 일정이 많아도
                         * 모두 표시
                         */
                        dayMaxEvents:
                            false,


                        /*
                         * 달력 높이 자동
                         */
                        height:
                            "auto",


                        /*
                         * 코스 일정이 화면에 생성되면
                         * hover용 클래스 추가
                         */
                        eventDidMount:
                            function (info) {

                                info.el.classList.add(
                                    "member-calendar-event"
                                );
                            },


                        /*
                         * 코스 A/B/C 클릭
                         */
                        eventClick:
                            function (info) {


                                /*
                                 * 클릭한 일정의
                                 * scheduleId
                                 */
                                const scheduleId =
                                    info.event.id;


                                /*
                                 * 일정 상세 API 호출
                                 */
                                fetch(
                                    `/member/api/schedules/${scheduleId}`
                                )


                                    /*
                                     * 서버 응답 확인
                                     */
                                    .then(function (response) {

                                        if (!response.ok) {

                                            throw new Error(
                                                "일정 상세정보를 불러올 수 없습니다."
                                            );
                                        }

                                        return response.json();
                                    })


                                    /*
                                     * 상세정보 출력
                                     */
                                    .then(function (scheduleDetail) {


                                        /*
                                         * 일정 날짜
                                         */
                                        selectedDateTitle.textContent =
                                            scheduleDetail.scheduleDate;


                                        /*
                                         * 코스
                                         */
                                        selectedCourse.textContent =
                                            scheduleDetail.siteName + " / "
                                            + scheduleDetail.courseCode + " " + scheduleDetail.courseName;


                                        /*
                                         * 그룹
                                         */
                                        selectedGroup.textContent =
                                            scheduleDetail.groupNo
                                            + "그룹";


                                        /*
                                         * 날씨
                                         */
                                        selectedWeather.textContent =
                                            scheduleDetail.weather
                                                ? scheduleDetail.weather
                                                : "-";


                                        /*
                                         * 기존 스팟 목록 제거
                                         */
                                        selectedSpots.innerHTML =
                                            "";


                                        /*
                                         * 스팟 일정 출력
                                         */
                                        scheduleDetail.spots
                                            .forEach(function (spot) {


                                                /*
                                                 * 스팟 전체 요소
                                                 */
                                                const spotItem =
                                                    document.createElement(
                                                        "article"
                                                    );

                                                spotItem.classList.add(
                                                    "schedule-item"
                                                );


                                                /*
                                                 * 순서
                                                 */
                                                const sequenceElement =
                                                    document.createElement(
                                                        "span"
                                                    );

                                                sequenceElement.classList.add(
                                                    "schedule-sequence"
                                                );

                                                sequenceElement.textContent =
                                                    spot.sequence;


                                                /*
                                                 * 시간 / 스팟 정보 영역
                                                 */
                                                const spotInformation =
                                                    document.createElement(
                                                        "div"
                                                    );


                                                /*
                                                 * 시간
                                                 */
                                                const timeElement =
                                                    document.createElement(
                                                        "strong"
                                                    );

                                                timeElement.classList.add(
                                                    "schedule-time"
                                                );

                                                timeElement.textContent =
                                                    spot.startTime.substring(
                                                        0,
                                                        5
                                                    );


                                                /*
                                                 * 스팟
                                                 */
                                                const spotElement =
                                                    document.createElement(
                                                        "p"
                                                    );

                                                spotElement.classList.add(
                                                    "schedule-spot"
                                                );

                                                spotElement.textContent =
                                                    spot.code + " " + spot.name;


                                                /*
                                                 * 조립
                                                 */
                                                spotInformation.appendChild(
                                                    timeElement
                                                );

                                                spotInformation.appendChild(
                                                    spotElement
                                                );

                                                spotItem.appendChild(
                                                    sequenceElement
                                                );

                                                spotItem.appendChild(
                                                    spotInformation
                                                );

                                                selectedSpots.appendChild(
                                                    spotItem
                                                );

                                            });


                                        /*
                                         * 상세 카드로 이동
                                         */
                                        scheduleDetailSection
                                            .scrollIntoView({

                                                behavior:
                                                    "smooth",

                                                block:
                                                    "start"
                                            });

                                    })


                                    /*
                                     * 오류
                                     */
                                    .catch(function (error) {

                                        console.error(
                                            error
                                        );


                                        selectedDateTitle.textContent =
                                            "일정 정보를 불러오지 못했습니다.";

                                        selectedCourse.textContent =
                                            "-";

                                        selectedGroup.textContent =
                                            "-";

                                        selectedWeather.textContent =
                                            "-";

                                        selectedSpots.innerHTML =
                                            "";

                                    });

                            }

                    }
                );


            /*
             * 달력 출력
             */
            calendar.render();

            const calendarTitle =
                calendarElement.querySelector(
                    '[role="heading"][aria-level="2"]'
                );

            if (calendarTitle) {
                const calendarToolbar =
                    calendarTitle.parentElement.parentElement;

                calendarToolbar.classList.add(
                    "calendar-toolbar-grid"
                );

                Array.from(calendarToolbar.children)
                    .forEach(function (toolbarColumn) {
                        toolbarColumn.classList.add(
                            "calendar-toolbar-column"
                        );
                    });
            }

        }
    );

</script>

</body>
</html>
