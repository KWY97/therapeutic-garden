<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page member-detail-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container member-detail-layout">
    <section class="card member-detail-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">참가자 상세 정보</h1>
            <p class="card-description">
                선택한 참가자의 등록 정보를 확인하고 관리합니다.
            </p>
        </div>

        <dl th:replace="~{fragments/member-profile :: details(${member}, ${formattedPhone})}"></dl>

        <div class="detail-action-list">
            <a class="primary-link-button"
               th:href="@{/admin/members/{memberId}/edit(memberId=${member.memberId})}">
                참가자 정보 수정
            </a>

            <a class="data-link-button"
               th:href="@{/admin/members/{memberId}/data(memberId=${member.memberId})}">
                데이터 보기
            </a>

            <a class="secondary-link-button"
               th:href="@{/admin/members}">
                참가자 목록으로
            </a>

            <form
                class="delete-form"
                th:action="@{/admin/members/{memberId}/delete(memberId=${member.memberId})}"
                method="post"
                onsubmit="return confirm('참가자를 삭제하면 해당 참가자의 모든 일정도 함께 삭제됩니다. 정말 삭제하시겠습니까?')"
            >
                <button
                    class="delete-button"
                    type="submit"
                >
                    참가자 삭제
                </button>

            </form>
        </div>

    </section>
</main>

</body>
</html>
