<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 데이터</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/measurement-history.css}">
    <link rel="stylesheet" th:href="@{/css/home-spatial.css(v='count-improvement')}">
</head>
<body class="dashboard-body service-page participant-analysis-page member-data-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="member-data-container">
    <header class="member-data-header">
        <p class="card-eyebrow">Administrator</p>
        <h1 class="card-title">참가자 데이터</h1>
        <div class="member-data-identity-row">
            <p class="member-data-identity"
               th:text="|P${#numbers.formatInteger(member.participantNo, 3)} · ${member.name != null ? member.name : '-'}|"></p>
            <a class="member-data-back-link"
               th:href="@{/admin/members/{memberId}(memberId=${member.memberId})}">← 참가자 상세로</a>
        </div>
        <p class="card-description">참가자의 측정 및 분석 데이터를 확인합니다.</p>
    </header>

    <div th:replace="~{fragments/member-healing-analysis :: analysis(false)}"></div>
</main>

<div th:replace="~{fragments/spot-detail-modal :: modal}"></div>
<th:block th:replace="~{fragments/member-healing-analysis :: scripts}"></th:block>
</body>
</html>
