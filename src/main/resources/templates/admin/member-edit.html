<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>참가자 정보 수정</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">

    <section class="card form-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>

            <h1 class="card-title">
                참가자 정보 수정
            </h1>

            <p class="card-description">
                참가자의 등록 정보를 수정합니다.
            </p>
        </div>

        <p class="password-success-message" role="status" th:if="${successMessage}" th:text="${successMessage}"></p>

        <!-- 중복 검사 등의 비즈니스 오류 메시지 -->
        <div
                class="error-message"
                th:if="${errorMessage}"
                th:text="${errorMessage}">
        </div>

        <form
                class="login-form"
                th:action="@{/admin/members/{memberId}/edit(memberId=${memberId})}"
                th:object="${memberEditForm}"
                method="post"
        >

            <!-- 참가자 번호 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="participantNo">
                    참가자 번호
                </label>

                <input
                        class="form-input"
                        id="participantNo"
                        type="number"
                        th:field="*{participantNo}"
                        min="1"
                        required
                >

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('participantNo')}"
                        th:errors="*{participantNo}">
                </p>

            </div>


            <!-- 그룹 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="groupNo">
                    그룹
                </label>

                <select
                        class="form-input"
                        id="groupNo"
                        th:field="*{groupNo}"
                        required
                >
                    <option value="1">1그룹</option>
                    <option value="2">2그룹</option>
                    <option value="3">3그룹</option>
                </select>

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('groupNo')}"
                        th:errors="*{groupNo}">
                </p>

            </div>


            <!-- 로그인 아이디 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="loginId">
                    로그인 아이디
                </label>

                <input
                        class="form-input"
                        id="loginId"
                        type="text"
                        th:field="*{loginId}"
                        required
                >

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('loginId')}"
                        th:errors="*{loginId}">
                </p>

            </div>


            <!-- 이름 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="name">
                    이름
                </label>

                <input
                        class="form-input"
                        id="name"
                        type="text"
                        th:field="*{name}"
                >

            </div>


            <!-- 전화번호 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="phone">
                    전화번호
                </label>

                <input
                        class="form-input"
                        id="phone"
                        type="tel"
                        th:field="*{phone}"
                        placeholder="010-1234-5678"
                        inputmode="numeric"
                >

            </div>


            <button
                    class="primary-button"
                    type="submit">
                수정 완료
            </button>

        </form>

        <div class="detail-action-list">
            <a class="secondary-link-button"
               th:href="@{/admin/members/{memberId}/password(memberId=${memberId})}">
                비밀번호 변경
            </a>
        </div>

        <a
                class="back-link"
                th:href="@{/admin/members/{memberId}(memberId=${memberId})}">
            참가자 상세로
        </a>

    </section>

</main>

</body>
</html>
