<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>일정 수정</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">

    <section class="card form-card">

        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>

            <h1 class="card-title">
                일정 수정
            </h1>

            <p class="card-description">
                기존 일정 정보를 수정합니다.
            </p>
        </div>


        <form
                class="login-form"
                th:action="@{/admin/schedules/{scheduleId}/edit(
                    scheduleId=${scheduleId},
                    from=${from}
                )}"
                th:object="${scheduleForm}"
                method="post"
        >

            <!-- 참가자 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="memberId">
                    참가자
                </label>

                <select
                        class="form-input"
                        id="memberId"
                        th:field="*{memberId}"
                        required
                >
                    <option value="">
                        참가자를 선택해 주세요
                    </option>

                    <option
                            th:each="member : ${members}"
                            th:value="${member.memberId}"
                            th:text="|${member.participantNo}번 · ${member.groupNo}그룹 · ${member.loginId}|">
                    </option>

                </select>

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('memberId')}"
                        th:errors="*{memberId}">
                </p>

            </div>


            <!-- 일정 날짜 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="scheduleDate">
                    일정 날짜
                </label>

                <input
                        class="form-input"
                        type="date"
                        id="scheduleDate"
                        name="scheduleDate"
                        th:value="${scheduleForm.scheduleDate}"
                        required
                >

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('scheduleDate')}"
                        th:errors="*{scheduleDate}">
                </p>

            </div>


            <div class="form-group">
                <label class="form-label" for="siteId">사이트</label>
                <select class="form-input" id="siteId" th:field="*{siteId}" required>
                    <option value="">사이트를 선택해 주세요</option>
                    <option th:each="site : ${sites}" th:value="${site.siteId}"
                            th:text="${site.name}"></option>
                </select>
                <p class="error-message" th:errors="*{siteId}"></p>
                <p id="selectionStatus" role="status"></p>
            </div>

            <!-- 코스 -->
            <div class="form-group">

                <label
                        class="form-label"
                        for="courseId">
                    코스
                </label>

                <select
                        class="form-input"
                        id="courseId"
                        th:field="*{courseId}"
                        th:attr="data-selected=${scheduleForm.courseId}"
                        required
                >
                    <option value="">선택해 주세요</option>
                </select>

                <p
                        class="error-message"
                        th:if="${#fields.hasErrors('courseId')}"
                        th:errors="*{courseId}">
                </p>

            </div>


            <!-- 첫 번째 스팟 -->
            <fieldset>

                <legend>
                    첫 번째 스팟
                </legend>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="firstSpotId">
                        스팟
                    </label>

                    <select
                            class="form-input"
                            id="firstSpotId"
                            th:field="*{firstSpotId}"
                            th:attr="data-selected=${scheduleForm.firstSpotId}"
                        required
                    >
                    <option value="">선택해 주세요</option>
                </select>

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('firstSpotId')}"
                            th:errors="*{firstSpotId}">
                    </p>

                </div>


                <div class="form-group">

                    <label
                            class="form-label"
                            for="firstStartTime">
                        시작 시간
                    </label>

                    <input
                            class="form-input"
                            type="time"
                            id="firstStartTime"
                            name="firstStartTime"
                            th:value="${scheduleForm.firstStartTime}"
                            required
                    >

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('firstStartTime')}"
                            th:errors="*{firstStartTime}">
                    </p>

                </div>

            </fieldset>


            <!-- 두 번째 스팟 -->
            <fieldset>

                <legend>
                    두 번째 스팟
                </legend>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="secondSpotId">
                        스팟
                    </label>

                    <select
                            class="form-input"
                            id="secondSpotId"
                            th:field="*{secondSpotId}"
                            th:attr="data-selected=${scheduleForm.secondSpotId}"
                        required
                    >
                    <option value="">선택해 주세요</option>
                </select>

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('secondSpotId')}"
                            th:errors="*{secondSpotId}">
                    </p>

                </div>


                <div class="form-group">

                    <label
                            class="form-label"
                            for="secondStartTime">
                        시작 시간
                    </label>

                    <input
                            class="form-input"
                            type="time"
                            id="secondStartTime"
                            name="secondStartTime"
                            th:value="${scheduleForm.secondStartTime}"
                            required
                    >

                    <p
                            class="error-message"
                            th:if="${#fields.hasErrors('secondStartTime')}"
                            th:errors="*{secondStartTime}">
                    </p>

                </div>

            </fieldset>


            <!-- 날씨 정보 -->
            <fieldset>

                <legend>
                    날씨 정보
                </legend>

                <div class="weather-lookup-actions">
                    <button
                            class="primary-button"
                            type="button"
                            id="weatherButton">
                        날씨 불러오기
                    </button>

                    <p
                            class="weather-range-hint"
                            id="weatherRangeHint">
                    </p>

                    <p
                            class="weather-lookup-status"
                            id="weatherLookupStatus"
                            role="status"
                            aria-live="polite"
                            aria-atomic="true">
                    </p>
                </div>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="weather">
                        날씨
                    </label>

                    <input
                            class="form-input"
                            type="text"
                            id="weather"
                            th:field="*{weather}"
                            readonly
                    >

                </div>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="temperature">
                        기온(℃)
                    </label>

                    <input
                            class="form-input"
                            type="number"
                            step="0.1"
                            id="temperature"
                            th:field="*{temperature}"
                            readonly
                    >

                </div>

                <div class="form-group">

                    <label
                            class="form-label"
                            for="humidity">
                        습도(%)
                    </label>

                    <input
                            class="form-input"
                            type="number"
                            step="0.1"
                            id="humidity"
                            th:field="*{humidity}"
                            readonly
                    >

                </div>

            </fieldset>


            <button
                    class="primary-button"
                    type="submit">
                수정 완료
            </button>

        </form>


        <a
                class="back-link"
                th:href="@{/admin/schedules/{scheduleId}(scheduleId=${scheduleId})}">
            일정 상세로
        </a>

    </section>

</main>

<script th:src="@{/js/weather-lookup.js}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const course =
                document.getElementById("courseId");

        const firstSpotId =
                document.getElementById("firstSpotId");

        const secondSpotId =
                document.getElementById("secondSpotId");

        const firstStartTime =
                document.getElementById("firstStartTime");

        const secondStartTime =
                document.getElementById("secondStartTime");

        const weatherButton =
                document.getElementById("weatherButton");


        const site = document.getElementById("siteId");
        const selectionStatus = document.getElementById("selectionStatus");
        let siteSpots = [];
        let requestVersion = 0;

        function setOptions(select, items, key, selected) {
            select.replaceChildren(new Option("선택해 주세요", ""));
            items.forEach(function (item) {
                select.add(new Option(item.code + " " + item.name, item[key]));
            });
            select.value = selected || "";
        }

        function selectSpots(firstId, secondId) {
            const spots = siteSpots.filter(spot => String(spot.courseId) === course.value);
            setOptions(firstSpotId, spots, "spotId", firstId);
            setOptions(secondSpotId, spots, "spotId", secondId);
        }

        async function loadSite(restore) {
            const version = ++requestVersion;
            siteSpots = [];
            setOptions(course, [], "courseId");
            selectSpots();
            selectionStatus.textContent = "";
            if (!site.value) return;
            selectionStatus.textContent = "코스와 스팟을 불러오는 중입니다.";
            try {
                const responses = await Promise.all([
                    fetch(`/api/sites/${site.value}/courses`),
                    fetch(`/api/sites/${site.value}/spots`)
                ]);
                if (responses.some(response => !response.ok)) throw new Error("조회 실패");
                const [courses, spots] = await Promise.all(responses.map(response => response.json()));
                if (version !== requestVersion) return;
                siteSpots = spots.sort((left, right) => left.spotId - right.spotId);
                setOptions(course, courses, "courseId", restore ? course.dataset.selected : "");
                selectSpots(restore ? firstSpotId.dataset.selected : "",
                        restore ? secondSpotId.dataset.selected : "");
                selectionStatus.textContent = courses.length ? "" : "등록된 코스가 없습니다.";
            } catch (error) {
                if (version !== requestVersion) return;
                selectionStatus.textContent = "선택지를 불러오지 못했습니다. 사이트 선택을 해제한 뒤 다시 선택해 주세요.";
            }
        }

        site.addEventListener("change", () => loadSite(false));
        loadSite(true);

        function setSecondStartTime() {

            if (!firstStartTime.value) {

                secondStartTime.value = "";

                return;
            }

            const [hour, minute] =
                    firstStartTime.value
                            .split(":")
                            .map(Number);

            const firstTime =
                    new Date();

            firstTime.setHours(hour);
            firstTime.setMinutes(minute);
            firstTime.setSeconds(0);

            firstTime.setMinutes(
                    firstTime.getMinutes() + 10
            );

            const secondHour =
                    String(
                            firstTime.getHours()
                    ).padStart(2, "0");

            const secondMinute =
                    String(
                            firstTime.getMinutes()
                    ).padStart(2, "0");

            secondStartTime.value =
                    `${secondHour}:${secondMinute}`;
        }


        course.addEventListener("change", function () {
            const spots = siteSpots.filter(spot => String(spot.courseId) === course.value);
            selectSpots(spots[0]?.spotId, spots[1]?.spotId);
            if (spots.length) {
                firstStartTime.value = "09:00";
                setSecondStartTime();
            }
        });

        firstSpotId.addEventListener("change", function () {
            const spots = siteSpots.filter(spot => String(spot.courseId) === course.value);
            // 기존 두 스팟 코스의 자동 짝 선택을 유지한다.
            if (spots.length === 2 && firstSpotId.value) {
                secondSpotId.value = spots.find(spot => String(spot.spotId) !== firstSpotId.value).spotId;
            }
        });

        firstStartTime.addEventListener("change", function () {

            setSecondStartTime();
        });


        WeatherLookup.bind({
            button: weatherButton,
            hint: document.getElementById("weatherRangeHint"),
            status: document.getElementById("weatherLookupStatus"),
            dateInput: document.getElementById("scheduleDate"),
            timeInput: firstStartTime,
            weatherInput: document.getElementById("weather"),
            temperatureInput: document.getElementById("temperature"),
            humidityInput: document.getElementById("humidity"),
            fetcher: window.fetch.bind(window)
        });

    });
</script>

</body>
</html>
