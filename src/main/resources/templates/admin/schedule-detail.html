<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 상세 정보</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="page-container">
    <section class="card member-detail-card">

        <div class="card-header">
            <p class="card-eyebrow" th:text="${memberMode} ? 'PARTICIPANT' : 'Administrator'">Administrator</p>
            <h1 class="card-title">일정 상세 정보</h1>
            <p class="card-description" th:text="${memberMode} ? '나의 일정과 스팟 순서를 확인합니다.' : '선택한 참가자의 일정과 스팟 순서를 확인합니다.'">
                선택한 참가자의 일정과 스팟 순서를 확인합니다.
            </p>
        </div>

        <dl class="member-detail-list">
            <div class="member-detail-item">
                <dt>일정 날짜</dt>
                <dd th:text="${schedule.scheduleDate}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>이름</dt>
                <dd th:text="${schedule.member.name != null ? schedule.member.name : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>그룹</dt>
                <dd th:text="|${schedule.member.groupNo}그룹|"></dd>
            </div>

            <div class="member-detail-item">
                <dt>아이디</dt>
                <dd th:text="${schedule.member.loginId}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>코스</dt>
                <dd th:text="|${schedule.siteName} / ${schedule.courseCode} ${schedule.courseName}|"></dd>
            </div>

            <div class="member-detail-item">
                <dt>날씨</dt>
                <dd th:text="${schedule.weather != null ? schedule.weather : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>기온(℃)</dt>
                <dd th:text="${schedule.temperature != null ? schedule.temperature + '℃' : '-'}"></dd>
            </div>

            <div class="member-detail-item">
                <dt>습도(%)</dt>
                <dd th:text="${schedule.humidity != null ? schedule.humidity + '%' : '-'}"></dd>
            </div>
        </dl>

        <section class="schedule-spot-section">
            <div class="schedule-spot-header">
                <h2>스팟 일정</h2>
                <p>방문 순서에 따라 표시됩니다.</p>
            </div>

            <div class="schedule-list">
                <article
                        class="schedule-item"
                        th:each="spot : ${scheduleSpots}">

                    <span
                            class="schedule-sequence"
                            th:text="${spot.sequence}">
                    </span>

                    <div>
                        <strong
                                class="schedule-time"
                                th:text="${spot.startTime}">
                        </strong>

                        <p class="schedule-spot" th:text="|${spot.code} ${spot.name}|"></p>

                    </div>
                </article>
            </div>

            <p
                    class="empty-message"
                    th:if="${#lists.isEmpty(scheduleSpots)}">
                등록된 스팟 일정이 없습니다.
            </p>
        </section>

        <p class="error-message" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <div class="detail-action-list">

            <a
                    class="primary-button"
                    th:unless="${memberMode}"
                    th:href="@{/admin/schedules/{scheduleId}/edit(
                        scheduleId=${schedule.scheduleId},
                        from=${from}
                    )}">
                일정 수정
            </a>

            <form
                    class="delete-form"
                    th:unless="${memberMode}"
                    th:action="@{/admin/schedules/{scheduleId}/delete(scheduleId=${schedule.scheduleId})}"
                    method="post"
                    onsubmit="return confirm('정말 이 일정을 삭제하시겠습니까?');"
            >
                <button
                        class="delete-button"
                        type="submit">
                    일정 삭제
                </button>
            </form>

            <a class="primary-button" th:if="${memberMode}"
               th:href="@{/member/schedules/{scheduleId}/edit(scheduleId=${schedule.scheduleId},from=${from})}">일정 수정</a>

            <form class="delete-form" th:if="${memberMode}"
                  th:action="@{/member/schedules/{scheduleId}/delete(scheduleId=${schedule.scheduleId},from=${from})}"
                  method="post" onsubmit="return confirm('정말 이 일정을 삭제하시겠습니까?');">
                <button class="delete-button" type="submit">일정 삭제</button>
            </form>


            <!-- 일정 목록에서 상세로 들어온 경우 -->
            <a
                    class="secondary-link-button"
                    th:if="${memberMode != true and from != 'calendar'}"
                    th:href="@{/admin/schedules}">
                일정 목록으로
            </a>


            <!-- 달력에서 상세로 들어온 경우 -->
            <a
                    class="secondary-link-button"
                    th:if="${memberMode != true and from == 'calendar'}"
                    th:href="@{/admin/schedules/calendar}">
                달력으로
            </a>

            <a class="secondary-link-button" th:if="${memberMode == true and from == 'calendar'}"
               th:href="@{/member}">달력으로</a>
            <a class="secondary-link-button" th:if="${memberMode == true and from != 'calendar'}"
               th:href="@{/member/schedules}">일정 목록으로</a>

        </div>
    </section>
</main>

</body>
</html>
