<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>참가자 목록</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>

<body class="dashboard-body service-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="dashboard-container admin-list-container">
    <nav class="admin-page-navigation" aria-label="관리자 화면 이동">
        <a class="logout-link" th:href="@{/admin}">관리자 메인</a>
    </nav>

    <header class="section-heading">
        <div>
            <p class="section-label">ADMINISTRATOR</p>
            <h1 class="section-title">참가자 목록</h1>
            <p class="card-description">현재 등록된 참가자 목록입니다.</p>
        </div>
    </header>

    <section class="card" aria-label="참가자 목록 콘텐츠">
        <p role="status" th:if="${successMessage}" th:text="${successMessage}"></p>
        <p role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <div class="schedule-list-toolbar">
            <a class="primary-link-button schedule-create-button" th:href="@{/admin/members/new}">참가자 등록</a>
        </div>


        <div class="table-wrapper">

            <table class="member-table">

                <thead>

                <tr>
                    <th>참가자 번호</th>
                    <th>그룹</th>
                    <th>이름</th>
                    <th>아이디</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="member : ${members}">

                    <!-- 참가자 번호 -->
                    <td>

                        <a
                                class="member-detail-link"
                                th:href="@{/admin/members/{memberId}(
                                    memberId=${member.memberId}
                                )}"
                                th:text="${member.participantNo}">
                        </a>

                    </td>


                    <!-- 그룹 -->
                    <td>

                        <span
                                class="group-label"
                                th:classappend="| group-${member.groupNo}-label|"
                                th:text="|${member.groupNo}그룹|">
                        </span>

                    </td>


                    <!-- 이름 -->
                    <td
                            th:text="${member.name != null
                                ? member.name
                                : '-'}">
                    </td>


                    <!-- 로그인 아이디 -->
                    <td th:text="${member.loginId}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>
</html>
