<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="page-body service-page">
<header th:replace="~{fragments/header :: header}"></header>
<main class="page-container">
    <section class="card login-card">
        <div class="card-header">
            <p class="card-eyebrow">Administrator</p>
            <h1 class="card-title">참가자 비밀번호 변경</h1>
            <p class="card-description">새 비밀번호는 8자 이상으로 입력해 주세요.</p>
        </div>
        <p class="error-message" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p>
        <form class="login-form"
              th:action="@{/admin/members/{memberId}/password(memberId=${member.memberId})}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <dl class="member-detail-list">
                <div class="member-detail-item">
                    <dt>참가자 번호</dt>
                    <dd th:text="${'P' + #numbers.formatInteger(member.participantNo, 3)}"></dd>
                </div>
                <div class="member-detail-item">
                    <dt>로그인 아이디</dt>
                    <dd style="min-width: 0; overflow-wrap: anywhere" th:text="${member.loginId}"></dd>
                </div>
            </dl>
            <div class="form-group">
                <label class="form-label" for="newPassword">새 비밀번호</label>
                <input class="form-input" type="password" id="newPassword" name="newPassword"
                       autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">새 비밀번호 확인</label>
                <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
                       autocomplete="new-password" minlength="8" required>
            </div>
            <div class="account-form-actions">
                <a class="secondary-link-button"
                   th:href="@{/admin/members/{memberId}/edit(memberId=${member.memberId})}">취소</a>
                <button class="primary-button" type="submit">변경</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
