<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>일정 목록</title>

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>

<body class="dashboard-body service-page">
<header th:replace="~{fragments/header :: header}"></header>

<main class="dashboard-container admin-list-container">
    <nav class="admin-page-navigation" aria-label="관리자 화면 이동" th:unless="${memberMode}">
        <a class="logout-link" th:href="@{/admin}">관리자 메인</a>
    </nav>

    <header class="section-heading">
        <div>
            <p class="section-label" th:text="${memberMode} ? 'PARTICIPANT' : 'ADMINISTRATOR'">ADMINISTRATOR</p>
            <h1 class="section-title">일정 목록</h1>
            <p class="card-description" th:text="${memberMode} ? '나의 일정을 확인합니다.' : '현재 등록된 참가자별 일정을 확인합니다.'">현재 등록된 참가자별 일정을 확인합니다.</p>
        </div>
    </header>

    <section class="card" aria-label="일정 목록 콘텐츠">


        <!-- ================================
             정렬 / 일정 등록
        ================================= -->
        <div class="schedule-list-toolbar" th:unless="${memberMode}">

            <!-- 정렬 -->
            <form
                    class="schedule-sort-form"
                    th:action="@{/admin/schedules}"
                    method="get">

                <label
                        for="sort"
                        class="schedule-sort-label">
                    정렬
                </label>

                <select
                        id="sort"
                        name="sort"
                        class="schedule-sort-select">

                    <!-- 일정 날짜순 -->
                    <option
                            value="date"
                            th:selected="${sort == 'date'}">
                        일정 날짜순
                    </option>

                    <!-- 그룹순 -->
                    <option
                            value="group"
                            th:selected="${sort == 'group'}">
                        그룹순
                    </option>

                </select>

                <button
                        type="submit"
                        class="schedule-sort-button">
                    정렬
                </button>

            </form>


            <!-- 새 일정 등록 -->
            <a
                    class="primary-link-button schedule-create-button"
                    th:href="@{/admin/schedules/new}">
                새 일정 등록
            </a>

        </div>

        <div class="schedule-list-toolbar" th:if="${memberMode}">
            <a class="primary-link-button schedule-create-button" th:href="@{/member/schedules/new}">새 일정 등록</a>
            <a class="secondary-link-button schedule-create-button" th:href="@{/member}">달력으로 돌아가기</a>
        </div>


        <!-- ================================
             일정 목록
        ================================= -->
        <div class="table-wrapper">

            <table class="member-table">

                <thead>

                <tr>
                    <th>일정 날짜</th>
                    <th th:unless="${memberMode}">이름</th>
                    <th th:unless="${memberMode}">그룹</th>
                    <th th:unless="${memberMode}">아이디</th>
                    <th>코스</th>
                    <th>날씨</th>
                </tr>

                </thead>


                <tbody>

                <tr th:each="schedule : ${schedules}">

                    <!-- 일정 날짜 / 상세 페이지 이동 -->
                    <td>

                        <a
                                class="member-detail-link"
                                th:if="${memberMode}"
                                th:href="@{/member/schedules/{scheduleId}(scheduleId=${schedule.scheduleId})}"
                                th:text="${schedule.scheduleDate}">
                        </a>
                        <a
                                class="member-detail-link"
                                th:unless="${memberMode}"
                                th:href="@{/admin/schedules/{scheduleId}(
                                    scheduleId=${schedule.scheduleId}
                                )}"
                                th:text="${schedule.scheduleDate}">
                        </a>

                    </td>


                    <!-- 이름 -->
                    <td
                            th:unless="${memberMode}"
                            th:text="${schedule.member.name != null
                                ? schedule.member.name
                                : '-'}">
                    </td>


                    <!-- 그룹 -->
                    <td th:unless="${memberMode}" th:text="|${schedule.member.groupNo}그룹|">
                    </td>


                    <!-- 로그인 아이디 -->
                    <td th:unless="${memberMode}" th:text="${schedule.member.loginId}">
                    </td>


                    <!-- 코스 -->
                    <td>

                        <span
                                class="course-label"
                                th:text="|${schedule.siteName} / ${schedule.courseCode} ${schedule.courseName}|">
                        </span>

                    </td>


                    <!-- 날씨 -->
                    <td
                            th:text="${schedule.weather != null
                                ? schedule.weather
                                : '-'}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>


        <!-- ================================
             등록된 일정이 없는 경우
        ================================= -->
        <p
                class="empty-message"
                th:if="${#lists.isEmpty(schedules)}">
            등록된 일정이 없습니다.
        </p>

    </section>

</main>

</body>
</html>
