plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.apache.poi:poi-ooxml:5.4.1'
	implementation 'software.amazon.awssdk:s3:2.54.17'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Explicit utility only; bootRun and application startup do not invoke this task.
tasks.register('healingEffectImport', JavaExec) {
	group = 'application'
	description = 'Explicit local healing-effect import/dry-run (external file and Site required)'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.example.manage.healingeffect.HealingEffectImportCli'
}

tasks.register('healingMeasurementImport', JavaExec) {
    group = 'application'
    description = 'Explicit local raw measurement dry-run/import; never creates schema'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.manage.healingeffect.RawMeasurementImportCli'
}

tasks.register('healingImprovementRebuild', JavaExec) {
    group = 'application'
    description = 'Explicit local Raw-to-Summary improvement count dry-run/rebuild; never creates schema'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.manage.healingeffect.HealingImprovementRebuildCli'
}

tasks.register('productionHealingMeasurementImport', JavaExec) {
    group = 'application'
    description = 'Explicit guarded Production raw measurement dry-run/import; never creates schema'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.manage.healingeffect.ProductionRawMeasurementImportCli'
}

tasks.register('productionHealingImprovementRebuild', JavaExec) {
    group = 'application'
    description = 'Explicit guarded Production Raw-to-Summary dry-run/rebuild; never creates schema'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.manage.healingeffect.ProductionHealingImprovementRebuildCli'
}
